  <!-- ================= AANTEKENINGEN ================= -->
  <text x="1230" y="150" font-size="13" font-weight="bold" fill="#123a5c">Mijn aantekeningen</text>
  <text x="1230" y="176" font-size="11" fill="#45566b">1. Menu wordt op mobiel</text>
  <text x="1236" y="192" font-size="11" fill="#45566b">een hamburgerknop.</text>
  <text x="1230" y="220" font-size="11" fill="#45566b">2. Kolommen gaan onder</text>
  <text x="1236" y="236" font-size="11" fill="#45566b">elkaar bij smal scherm.</text>
  <text x="1230" y="264" font-size="11" fill="#45566b">3. Plaatje altijd met</text>
  <text x="1236" y="280" font-size="11" fill="#45566b">alt-tekst (toegankelijk).</text>
  <text x="1230" y="308" font-size="11" fill="#45566b">4. Elk onderdeel eigen</text>
  <text x="1236" y="324" font-size="11" fill="#45566b">vlak + eigen h2-kop.</text>
  <text x="1230" y="352" font-size="11" fill="#45566b">5. Contact als echte</text>
  <text x="1236" y="368" font-size="11" fill="#45566b">links (mailto en https).</text>
  <text x="1230" y="396" font-size="11" fill="#45566b">6. Geen cookies of</text>
  <text x="1236" y="412" font-size="11" fill="#45566b">trackers: eerlijke notitie.</text>
  <text x="1230" y="440" font-size="11" fill="#45566b">7. Alles in rem-maten,</text>
  <text x="1236" y="456" font-size="11" fill="#45566b">dus zoomen blijft leesbaar.</text>
